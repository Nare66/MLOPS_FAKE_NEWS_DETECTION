version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fakenews-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ADMIN_API_KEY=admin-mlops-secret-2026
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/data:/app/backend/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./monitoring/reports:/app/monitoring/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - fakenews-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fakenews-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fakenews-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: fakenews-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlruns/mlflow.db
    networks:
      - fakenews-net

networks:
  fakenews-net:
    driver: bridge
